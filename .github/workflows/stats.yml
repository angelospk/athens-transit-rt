# Copies the daily statistics (GET /v1/stats, docs/API.md) to the orphan branch `stats`, so
# readers fetch them from GitHub and not from the server. The branch keeps every day, even if
# the server loses its state. Days are written by the server about 4-5 h after local midnight
# (it waits for the trips that run past midnight).
name: stats
on:
  schedule:
    # GitHub may skip a scheduled run (it did on 2026-10-08), so the job runs twice; a run
    # with nothing new changes nothing. The map shows the new day at about 05:40 Athens.
    - cron: "40 3 * * *" # 06:40 Athens summer time, 05:40 winter
    - cron: "40 7 * * *" # 10:40 Athens summer time, 09:40 winter: retry
  workflow_dispatch:
    inputs:
      refresh:
        description: "Download again the days the branch already has (after the server rewrote them)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      API: ${{ vars.STATS_API || 'https://transit.haroldpoi.dev' }}
      GH_TOKEN: ${{ github.token }}
      REFRESH: ${{ inputs.refresh && 'true' || 'false' }}
      # Earlier days stay in v1/days but are not listed: their seen/missed counts are not
      # reliable. Keep equal to stats.FirstDay (internal/stats/stats.go).
      FIRST_DAY: "2026-10-30"
      # Thessaloniki (OASTH): its own instance, days under v1/thessaloniki/. The instance started
      # on 2026-11-06 at 23:22 Athens, so 2026-11-06 is a partial day.
      API_THESSALONIKI: ${{ vars.STATS_API_THESSALONIKI || 'https://transit-thess.haroldpoi.dev' }}
      FIRST_DAY_THESSALONIKI: "2026-11-07"
    steps:
      - name: Check out the stats branch (or start it)
        run: |
          git init -q pub && cd pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin stats; then
            git checkout -q -b stats FETCH_HEAD
          else
            git checkout -q --orphan stats
          fi
      - name: Download new days and write index and latest
        working-directory: pub
        run: |
          set -euo pipefail
          # publish <api> <dir> <first day>: copy the server's new days to <dir>/days and write
          # <dir>/index.json and <dir>/latest.json.
          publish() {
            local api=$1 dir=$2 first=$3 d days latest
            mkdir -p "$dir/days"
            # set -e does not apply inside a function called with ||: check each step.
            rm -f ../index.json
            curl -fsS --retry 3 --max-time 30 "$api/v1/stats" -o ../index.json || return 1
            jq -e '.version == 1 and (.days | type == "array")' ../index.json >/dev/null || return 1
            for d in $(jq -r '.days[]' ../index.json); do
              [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad day $d"; return 1; }
              [[ "$d" < "$first" ]] && continue
              [ -f "$dir/days/$d.json" ] && [ "$REFRESH" != true ] && continue
              # One bad day must not block the others; it is tried again tomorrow.
              if ! curl -fsS --retry 3 --max-time 30 "$api/v1/stats/days/$d" -o "../$d.json" ||
                 ! jq -e --arg d "$d" '.version == 1 and .date == $d and (.hours | length) == 24' "../$d.json" >/dev/null; then
                echo "::warning::$dir: day $d skipped"; rm -f "../$d.json"; continue
              fi
              mv "../$d.json" "$dir/days/$d.json" || return 1
              echo "$dir: new day $d"
            done
            days=$(ls "$dir/days" | sed -n 's/^\([0-9-]*\)\.json$/\1/p' | sort | awk -v f="$first" '$0 >= f')
            if [ -z "$days" ]; then
              # No day from the first day yet: list none and show no earlier day as the latest.
              jq -nc '{version: 1, latest: "", days: []}' > "$dir/index.json"
              rm -f "$dir/latest.json"
            else
              latest=$(echo "$days" | tail -1)
              printf '%s\n' $days | jq -R . | jq -sc --arg l "$latest" '{version: 1, latest: $l, days: .}' > "$dir/index.json"
              cp "$dir/days/$latest.json" "$dir/latest.json"
            fi
          }
          publish "$API" v1 "$FIRST_DAY"
          # Thessaloniki has its own server; an outage there must not block the Athens days.
          publish "$API_THESSALONIKI" v1/thessaloniki "$FIRST_DAY_THESSALONIKI" ||
            echo "::warning::Thessaloniki stats skipped"
      - name: Write README
        working-directory: pub
        run: |
          set -euo pipefail
          cat > README.md <<'MD'
          # athens-transit-rt daily statistics

          One file per day (Europe/Athens) of the OASA buses and trolleys seen by
          [athens-transit-rt](https://github.com/angelospk/athens-transit-rt): GPS fixes,
          vehicles and travel speed per hour and per line, and how many scheduled trips ran
          (`trips`). Updated daily by the `stats` workflow.

          - `v1/latest.json`: the newest day
          - `v1/index.json`: all days from 2026-10-30 (earlier files in `v1/days` are kept but
            not listed: their seen/missed trip counts are not reliable)
          - `v1/days/YYYY-MM-DD.json`: one day
          - `v1/thessaloniki/`: the same files for the OASTH buses of Thessaloniki, from
            2026-11-07 (no `start_delay`: it comes from OASA's daily schedule)

          Speed (km/h) = `dist_m / time_s * 3.6`. Fields and method: `docs/API.md` on `main`.
          Raw URL: `https://raw.githubusercontent.com/angelospk/staseis-rt/stats/v1/latest.json`
          MD
      - name: Commit and push
        working-directory: pub
        run: |
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "stats: $(jq -r .latest v1/index.json), thessaloniki $(jq -r .latest v1/thessaloniki/index.json 2>/dev/null || echo -)"
          git push -q origin stats

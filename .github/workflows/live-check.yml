# Calls every endpoint of the public instance once a day and checks it against the OpenAPI spec
# and the /v2 data rules (scripts/check-openapi-live.py). A failure opens an issue labelled
# live-check, or comments on the open one; the next good run closes it. It catches an upstream
# (OASA, STASY, railway.gov.gr) that changed its format before users do.
name: live-check
on:
  schedule:
    - cron: "23 8 * * *" # 10:23 Athens winter, 11:23 summer: buses, metro and trains run
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: live-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/live-check.sh

# Opens one issue per batch of new commits on foivospro/athens-gtfs-realtime since the SHA
# in UPSTREAM.md.
name: upstream-watch
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/upstream-watch.sh
